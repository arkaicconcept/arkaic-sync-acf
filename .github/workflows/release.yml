name: Build & Attach Release Zip

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: arkaic-sync-acf

      - name: Package plugin zip
        run: |
          # Crée l'archive avec le dossier racine attendu par WordPress
          zip -r arkaic-sync-acf.zip arkaic-sync-acf -x "arkaic-sync-acf/.git/*" "arkaic-sync-acf/.github/*" "arkaic-sync-acf/.gitignore"

      - name: Upload zip to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" arkaic-sync-acf.zip --clobber
